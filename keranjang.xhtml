<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/chtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="id" xml:lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>E-Lib | Keranjang</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="keranjang">
<header id="nav"></header>
<main class="container">
  <p class="crumb"><a href="index.xhtml">Beranda</a> <span>&#8250;</span> <span class="muted">Keranjang</span></p>
  <h1>Keranjang</h1>
  <div class="layout">
    <section>
      <div class="card pick-all"><input id="chkAll" type="checkbox" /> <label for="chkAll">Pilih Semua</label></div>
      <div id="items"></div>
    </section>
    <aside class="card summary">
      <h3>Ringkasan Keranjang</h3>
      <div class="sum-row"><b>Judul</b><ul id="sumList"></ul></div>
      <hr />
      <div class="sum-row"><b>Total Buku</b><span id="total">0</span></div>
      <label for="hari" class="small">Lama pinjam (maks. 14 hari)</label>
      <select id="hari"></select>
      <button id="btnPinjam" type="button" class="btn btn-primary btn-block" disabled="disabled">Pinjam</button>
    </aside>
  </div>
</main>
<script src="js/app.js"></script>
</body>
</html>
