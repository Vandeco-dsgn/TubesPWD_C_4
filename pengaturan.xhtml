<body id="page-pengaturan">
<div id="nav"></div>
<div class="container">
  <p class="crumb"><a href="index.xhtml">Beranda</a> <span>&#8250;</span> <span class="muted">Pengaturan</span></p>
  <h1>Pengaturan</h1>
  <p class="muted">Kelola informasi akun</p>
  <div class="card pad">
    <h3 class="card-title">Profil Saya</h3>
    <div class="avatar-row">
      <img id="avatar" class="avatar-lg" src="data:image/gif;base64,R0lGODlhAQABAAAAACwAAAAAAQABAAA=" alt="Foto profil" />
      <div>
        <input id="fileFoto" type="file" accept="image/png,image/jpeg,image/gif,image/webp" class="hide" />
        <button id="btnFoto" type="button" class="btn btn-sm">Ubah Foto</button>
        <button id="btnHapus" type="button" class="btn btn-sm btn-danger hide">Hapus Foto</button>
        <div class="url-row">
          <input id="fotoUrl" type="text" class="t-url" title="atau tempel URL gambar (https://...)" />
          <button id="btnUrl" type="button" class="btn btn-sm">Pakai URL</button>
        </div>
      </div>
    </div>
    <form id="profileForm" action="pengaturan.php" method="post">
      <div>
        <div class="two">
          <div><label for="username">Username</label><input id="username" name="username" type="text" /></div>
          <div><label for="email">Email</label><input id="email" name="email" type="text" class="t-email" /></div>
        </div>
        <label for="password">Password baru <span class="muted">(kosongkan jika tidak diganti)</span></label>
        <input id="password" name="password" type="password" />
        <div class="form-foot"><button type="submit" class="btn btn-primary">Simpan Perubahan</button></div>
      </div>
    </form>
  </div>
</div>
