<body class="auth-bg" id="page-login">
<div class="auth-card">
  <div class="auth-form">
    <h1 class="serif">Halaman Masuk</h1>
    <p class="muted small">Masuk dan lanjutkan perjalanan membaca Anda.</p>
    <form id="loginForm" action="login.php" method="post">
      <div>
        <label for="username">Username</label>
        <div class="input-wrap">
          <img src="images/icons/mail.svg" width="16" height="16" alt="" />
          <input id="username" name="username" type="text" title="Masukkan username" />
        </div>
        <label for="password">Password</label>
        <div class="input-wrap">
          <img src="images/icons/lock.svg" width="16" height="16" alt="" />
          <input id="password" name="password" type="password" title="Masukkan password" />
          <button type="button" class="eye" value="password" title="Tampilkan password"><img src="images/icons/eye.svg" width="16" height="16" alt="Tampilkan password" /></button>
        </div>
        <p id="msg" class="form-msg"></p>
        <button type="submit" class="btn btn-primary btn-block">Masuk</button>
      </div>
    </form>
  </div>
  <div class="auth-side">
