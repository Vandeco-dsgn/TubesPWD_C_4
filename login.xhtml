<!DOCTYPE html
PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"DTD/xhtml1-transitional.dtd">
<html xmlns="https://www.w3.org/1999/xhtml/" xml:lang="en" lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>E-Lib | Masuk</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-bg" data-page="login">
<main class="auth-card">
  <section class="auth-form">
    <h1 class="serif">Halaman Masuk</h1>
    <p class="muted small">Masuk dan lanjutkan perjalanan membaca Anda.</p>
    <form id="loginForm" novalidate="novalidate">
      <label for="username">Username</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <input id="username" name="username" type="text" placeholder="Masukkan username" autocomplete="username" required="required" />
      </div>
      <label for="password">Password</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
        <input id="password" name="password" type="password" placeholder="Masukkan password" autocomplete="current-password" required="required" />
        <button type="button" class="eye" data-eye="password" aria-label="Tampilkan password">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p id="msg" class="form-msg" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block">Masuk</button>
    </form>
  </section>
  <section class="auth-side">
    <h2 class="serif">Halo, Selamat Datang!</h2>
    <p>Belum punya akun? Daftarkan diri Anda dan temukan cerita favorit untuk dibaca setiap hari.</p>
    <a class="btn btn-outline-light" href="pendaftaran.xhtml">DAFTAR</a>
  </section>
</main>
<script src="js/app.js"></script>
</body>
</html>
