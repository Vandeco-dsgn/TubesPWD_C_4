<link rel="stylesheet" type="text/css" href="css/base.css?v=20261128c" />
<link rel="stylesheet" type="text/css" href="css/components.css?v=20261128c" />

<body id="page-tambah-buku">
<div id="nav"></div>
<div class="container">
  <p class="crumb"><a href="index.xhtml">Beranda</a> <span>&#8250;</span> <span class="muted">Tambah Buku</span></p>
  <h1>Tambah Buku</h1>
  <p class="muted">Khusus staff. Lisensi menentukan berapa orang yang bisa meminjam buku ini pada waktu yang sama.</p>
  <div class="card pad">
    <form id="bookForm" action="tambah-buku.php" method="post" enctype="multipart/form-data">
      <div>
        <div class="two">
          <div><label for="isbn">ISBN</label><input id="isbn" name="isbn" type="text" maxlength="17" title="9786020000000" /></div>
          <div><label for="judul">Judul</label><input id="judul" name="judul" type="text" maxlength="255" /></div>
          <div><label for="penulis">Penulis <span class="muted">(pisahkan dengan koma)</span></label><input id="penulis" name="penulis" type="text" /></div>
          <div><label for="penerbit">Penerbit</label><input id="penerbit" name="penerbit" type="text" maxlength="255" /></div>
          <div><label for="kategori">Kategori <span class="muted">(pisahkan dengan koma)</span></label><input id="kategori" name="kategori" type="text" /></div>
          <div><label for="edisi">Edisi <span class="muted">(opsional)</span></label><input id="edisi" name="edisi" type="text" class="t-number" /></div>
          <div><label for="halaman">Jumlah halaman</label><input id="halaman" name="halaman" type="text" class="t-number" /></div>
          <div><label for="license">Lisensi (peminjam bersamaan)</label><input id="license" name="license" type="text" class="t-number" value="1" /></div>
          <div><label for="format">Format file</label>
            <select id="format" name="format"><option value="pdf">PDF</option><option value="epub">EPUB</option></select></div>
          <div></div>
          <div><label for="cover">Sampul (unggah gambar)</label><input id="cover" name="cover" type="file" accept="image/*" /></div>
          <div><label for="cover_url">atau URL sampul</label><input id="cover_url" name="cover_url" type="text" maxlength="255" title="https://..." /></div>
          <div><label for="file">File buku (PDF/EPUB)</label><input id="file" name="file" type="file" accept=".pdf,.epub" /></div>
          <div><label for="file_url">atau URL file buku</label><input id="file_url" name="file_url" type="text" maxlength="255" title="https://..." /></div>
        </div>
        <div class="form-foot"><button type="submit" class="btn btn-primary">Simpan Buku</button></div>
      </div>
    </form>
  </div>
</div>
<script type="text/javascript" src="js/common/helpers.js?v=20261128c"></script>

</body>
</html>
