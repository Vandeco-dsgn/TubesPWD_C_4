<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="id" xml:lang="id">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>E-Lib | Daftar</title>
<link rel="stylesheet" type="text/css" href="css/base.css?v=20261128c" />
<link rel="stylesheet" type="text/css" href="css/components.css?v=20261128c" />
<link rel="stylesheet" type="text/css" href="css/auth.css?v=20261128c" />
</head>
<body class="auth-bg" id="page-pendaftaran">
<div class="auth-card">
  <div class="auth-side">
    <h2 class="serif">Selamat Datang Kembali!</h2>
    <p>Sudah punya akun? Masuk dan lanjutkan buku yang sedang Anda baca.</p>
    <a class="btn btn-outline-light" href="login.xhtml">MASUK</a>
  </div>
  <div class="auth-form">
    <h1 class="serif">Buat Akun</h1>
    <p class="muted small">Daftar gratis dan mulai meminjam e-book.</p>
    <form id="regForm" action="pendaftaran.php" method="post">
      <div>
        <label for="username">Username</label>
        <div class="input-wrap"><input id="username" name="username" type="text" title="Pilih username" /></div>
        <label for="email">Email</label>
        <div class="input-wrap"><input id="email" name="email" type="text" class="t-email" title="nama@email.com" /></div>
        <label for="password">Password</label>
        <div class="input-wrap"><input id="password" name="password" type="password" title="Minimal 6 karakter" /></div>
        <label for="konfirmasi">Konfirmasi Password</label>
        <div class="input-wrap"><input id="konfirmasi" name="konfirmasi" type="password" title="Ulangi password" /></div>
        <p id="msg" class="form-msg"></p>
        <button type="submit" class="btn btn-primary btn-block">Daftar</button>
      </div>
    </form>
  </div>
</div>
<script type="text/javascript" src="js/common/helpers.js?v=20261128c"></script>
<script type="text/javascript" src="js/common/api.js?v=20261128c"></script>
<script type="text/javascript" src="js/pages/auth.js?v=20261128c"></script>
</body>
</html>
